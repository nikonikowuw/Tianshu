services:
  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      TIANSHU_APP__ENV: production
      TIANSHU_DATABASE__DSN: ${TIANSHU_DATABASE__DSN:?TIANSHU_DATABASE__DSN is required}
      TIANSHU_AUTH__JWT_SECRET: ${TIANSHU_AUTH__JWT_SECRET:?TIANSHU_AUTH__JWT_SECRET is required}
      TIANSHU_AUTH__COOKIE_SECURE: ${TIANSHU_AUTH__COOKIE_SECURE:-true}
    volumes:
      - app_uploads:/app/data/uploads
    healthcheck:
      test: ["CMD", "/app/tianshu", "--help"]
      disable: true

volumes:
  app_uploads:
