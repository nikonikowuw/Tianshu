version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - exhaustive
    - gocritic
    - govet
    - revive
    - staticcheck
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: indent-error-flow
        - name: package-comments
          disabled: true
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
  exclusions:
    paths:
      - internal/modules/.*/internal/dbgen/.*

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - tianshu
  exclusions:
    paths:
      - internal/modules/.*/internal/dbgen/.*
