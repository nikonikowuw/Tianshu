# Copy this template to configs/config.toml (or configs/config.local.toml) for local customization.
# Explicit path: tianshu -config /path/to/config.toml or TIANSHU_CONFIG=/path/to/config.toml.
# Environment overrides use TIANSHU_ prefix with double underscores (e.g. TIANSHU_AUTH__JWT_SECRET).

[app]
env = "development" # development | production
name = "tianshu"

[server]
addr = ":8080"
read_timeout = "15s"
write_timeout = "30s"
idle_timeout = "60s"
shutdown_timeout = "10s"
trusted_proxies = []

[cors]
enabled = false
allowed_origins = []

[database]
dsn = "postgres://tianshu:tianshu@localhost:5432/tianshu?sslmode=disable"
auto_migrate = true
max_conns = 25
min_conns = 2
max_conn_lifetime = "30m"

[cache]
driver = "memory" # memory | redis
redis_addr = "localhost:6379"
redis_password = ""
redis_db = 0

[storage]
driver = "local" # local | s3
local_root = "./data/uploads"
max_file_size_bytes = 10485760   # 10 MiB
max_avatar_size_bytes = 2097152  # 2 MiB
signed_url_ttl = "5m"
signed_url_secret = ""           # optional >=32-byte dedicated secret; empty falls back to auth.jwt_secret
allowed_mime_types = []          # optional extra MIME types beyond built-in allowlist

[storage.s3]
endpoint = "http://localhost:9000" # set for MinIO / R2 / custom S3 endpoint
region = "us-east-1"
bucket = "tianshu"
access_key = ""                    # inject via TIANSHU_STORAGE__S3__ACCESS_KEY in production
secret_key = ""                    # inject via TIANSHU_STORAGE__S3__SECRET_KEY in production
use_path_style = true
auto_create_bucket = false         # true creates the bucket on startup; false requires an existing bucket (e.g. `mc mb local/tianshu`)

[auth]
# Production requires a strong random secret (>= 32 bytes) via TIANSHU_AUTH__JWT_SECRET.
jwt_secret = "dev-only-change-me-at-least-32-bytes-secret"
access_token_ttl = "15m"
refresh_token_ttl = "168h"
cookie_secure = false

[bootstrap]
# Optional unattended initial super-admin bootstrap (recommended for automated/public deployments).
# Can also be provided via TIANSHU_ADMIN_USERNAME, TIANSHU_ADMIN_EMAIL, TIANSHU_ADMIN_PASSWORD.
admin_username = ""
admin_email = ""
admin_display_name = ""
admin_password = ""

[audit]
retention_days = 180

[log]
level = "info" # debug | info | warn | error
