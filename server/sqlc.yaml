version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/modules/access/queries.sql"
    gen:
      go:
        package: "dbgen"
        out: "internal/modules/access/internal/dbgen"
        sql_package: "pgx/v5"
        emit_json_tags: false
        emit_interface: false
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "NullUUID"
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/modules/identity/queries.sql"
    gen:
      go:
        package: "dbgen"
        out: "internal/modules/identity/internal/dbgen"
        sql_package: "pgx/v5"
        emit_json_tags: false
        emit_interface: false
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "NullUUID"
